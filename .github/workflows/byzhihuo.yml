name: 不移之火论坛自动签到

on:
  schedule:
    # 北京时间每天早上8点执行
    - cron: '0 0 * * *'
  workflow_dispatch:  # 支持手动触发

jobs:
  signin:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装Chrome
        run: |
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" > /etc/apt/sources.list.d/google-chrome.list
          apt-get update -qq
          apt-get install -y -qq google-chrome-stable

      - name: 安装依赖
        run: |
          pip install -q selenium webdriver-manager ddddocr python-dotenv notify

      - name: 运行签到脚本
        env:
          BYZHIUO_USER: ${{ secrets.BYZHIUO_USER }}
          BYZHIUO_PASS: ${{ secrets.BYZHIUO_PASS }}
          GITHUB_ACTIONS: true
        run: |
          python byzhihuo_signin.py

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signin-logs
          path: signin.log
          retention-days: 7
