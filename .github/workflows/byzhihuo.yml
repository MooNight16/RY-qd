name: 不移之火自动签到

on:
  schedule:
      - cron: '10 0 * * *'    # 北京时间 08:10
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  sign-in:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行签到脚本
        env:
          BYZH_ACCOUNTS: ${{ secrets.BYZH_ACCOUNTS }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          python byzhsign.py

      - name: 上传运行日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-logs
          path: |
            temp/
            *.log
          if-no-files-found: ignore
