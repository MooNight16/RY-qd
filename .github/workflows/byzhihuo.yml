name: 不移之火每日签到

on:
  workflow_dispatch:  # 支持手动触发
  schedule:
    # 每日 北京时间 08:00 执行 (UTC 00:00)
    - cron: '0 0 * * *'

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装系统依赖(Chrome)
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser chromium-chromedriver

      - name: 安装Python依赖
        run: |
          python -m pip install --upgrade pip
          pip install selenium webdriver-manager ddddocr python-dotenv opencv-python requests

      - name: 执行签到脚本
        env:
          GITHUB_ACTIONS: true
          DEBUG: false
          HEADLESS: true
          # 读取仓库密钥
          BYZHIHUO_USER: ${{ secrets.BYZHIHUO_USER }}
          BYZHIHUO_PASS: ${{ secrets.BYZHIHUO_PASS }}
        run: python byzhihuo.py
